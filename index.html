<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पीथला ठिकाना | Pithla Thikana - The Royal Heritage of Rawlot Bhati Rajputs</title>
    <meta name="description" content="Official Heritage Portal of Pithla Thikana, Jaisalmer, Rajasthan. Preserving the royal legacy, genealogy, fort architecture, and history of Rawlot Bhati Rajputs.">
    <meta name="theme-color" content="#2C1810">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2C1810;
            font-family: 'Cinzel', 'Noto Sans Devanagari', serif, sans-serif;
        }

        /* Royal Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: #2C1810;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-emblem {
            width: 70px;
            height: auto;
            filter: brightness(0) invert(1);
            margin-bottom: 1.2rem;
            animation: pulse 2s infinite ease-in-out;
        }

        .loader-title {
            color: #FFD700;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .loader-subtitle {
            color: #DAA520;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .loader-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(218, 165, 32, 0.2);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 10px #FFD700); }
        }

        /* Seamless Apps Script Web App Frame */
        #pithlaFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #FFF8E7;
        }
    </style>
</head>
<body>

    <!-- Royal Loading Screen -->
    <div id="loader">
        <img src="Photos/Bhati%20Symbl.png" 
             onerror="this.style.display='none'" 
             alt="Bhati Emblem" 
             class="loader-emblem">
        <div class="loader-title">पीथला ठिकाना</div>
        <div class="loader-subtitle">PITHLA THIKANA</div>
        <div class="loader-spinner"></div>
    </div>

    <!-- Embedded Google Apps Script CMS Web App -->
    <iframe id="pithlaFrame" 
            title="Pithla Thikana Official Portal" 
            allow="camera; clipboard-read; clipboard-write;"
            loading="eager">
    </iframe>

    <script>
        // =========================================================================
        // PITHLA.IN OFFICIAL GOOGLE APPS SCRIPT WEB APP INTEGRATION
        // =========================================================================
        
        // ⚠️ अपने Google Apps Script का Web App URL यहाँ नीचे डालें:
        const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzFaY7kAiEmh6k_12RlX2Ta-QIlmpLiTlewHRH63fOWWQ8mEyPKoKCK2rld9I3tPXiY/exec";

        (function() {
            const frame = document.getElementById('pithlaFrame');
            const loader = document.getElementById('loader');

            // Check if placeholder URL is still present
            if (APPS_SCRIPT_WEBAPP_URL.includes('AKfycbw6TzXhSjYQWzO_EXAMPLE') || !APPS_SCRIPT_WEBAPP_URL.startsWith('https://script.google.com/macros/s/')) {
                loader.innerHTML = `
                    <div style="text-align:center; padding:2rem; max-width:600px; color:#FFD700; font-family:serif;">
                        <img src="Photos/Bhati%20Symbl.png" onerror="this.style.display='none'" style="width:60px; filter:brightness(0) invert(1); margin-bottom:1rem;">
                        <h2 style="font-size:1.8rem; margin-bottom:0.8rem; color:#FFD700;">पीथला ठिकाना | Pithla Thikana</h2>
                        <div style="background:rgba(218,165,32,0.15); border:1px solid #DAA520; border-radius:8px; padding:1.2rem; margin:1.2rem 0; text-align:left; color:#FFF8E7; font-family:sans-serif; font-size:0.95rem; line-height:1.6;">
                            <strong style="color:#FFD700;">⚙️ Web App URL Setup Required:</strong><br>
                            कृपया <code>index.html</code> फ़ाइल खोलें और <code>APPS_SCRIPT_WEBAPP_URL</code> में अपना असली Apps Script Web App Deployment URL पेस्ट करें।
                        </div>
                    </div>
                `;
                return;
            }

            // Forward query parameters (?page=gallery, ?page=genealogy, etc.)
            const currentSearch = window.location.search || '';
            let targetUrl = APPS_SCRIPT_WEBAPP_URL;

            if (currentSearch) {
                const separator = targetUrl.includes('?') ? '&' : '?';
                targetUrl += separator + currentSearch.substring(1);
            }

            frame.src = targetUrl;

            // Hide loader once frame is loaded
            frame.onload = function() {
                setTimeout(function() {
                    loader.classList.add('hidden');
                }, 300);
            };

            // Safety timeout: hide loader after 4 seconds regardless
            setTimeout(function() {
                loader.classList.add('hidden');
            }, 4000);
        })();
    </script>
</body>
</html>
